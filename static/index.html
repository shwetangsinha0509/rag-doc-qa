<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Document Q&A</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      color: #888;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 680px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .upload-area {
      border: 2px dashed #2a2d3e;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-area:hover { border-color: #6c63ff; }

    .upload-area input { display: none; }

    .upload-area label {
      cursor: pointer;
      color: #6c63ff;
      font-weight: 500;
    }

    .upload-area p { color: #666; font-size: 0.85rem; margin-top: 6px; }

    .btn {
      background: #6c63ff;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 16px;
      transition: background 0.2s;
    }

    .btn:hover { background: #574fd6; }
    .btn:disabled { background: #333; cursor: not-allowed; }

    .status {
      margin-top: 12px;
      font-size: 0.875rem;
      min-height: 20px;
    }

    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
    .status.loading { color: #facc15; }

    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 4px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.6;
      max-width: 90%;
    }

    .message.user {
      background: #6c63ff22;
      border: 1px solid #6c63ff44;
      align-self: flex-end;
      color: #c4c0ff;
    }

    .message.assistant {
      background: #1e2130;
      border: 1px solid #2a2d3e;
      align-self: flex-start;
      color: #e0e0e0;
    }

    .message.thinking {
      color: #facc15;
      background: transparent;
      border: none;
      font-style: italic;
      font-size: 0.85rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-row input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #6c63ff; }
    .input-row input:disabled { opacity: 0.5; }

    .locked-doc {
      font-size: 0.8rem;
      color: #4ade80;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <h1>📄 RAG Document Q&A</h1>
  <p class="subtitle">Upload a PDF and ask questions about it</p>

  <!-- Upload Card -->
  <div class="card">
    <h2>Step 1 — Upload Document</h2>
    <div class="upload-area">
      <input type="file" id="fileInput" accept=".pdf" />
      <label for="fileInput">Choose a PDF file</label>
      <p id="fileName">No file selected</p>
    </div>
    <button class="btn" id="uploadBtn" disabled>Upload & Process</button>
    <div class="status" id="uploadStatus"></div>
  </div>

  <!-- Query Card -->
  <div class="card">
    <h2>Step 2 — Ask Questions</h2>
    <div class="locked-doc" id="docLabel" style="display:none"></div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-row">
      <input type="text" id="questionInput" placeholder="Ask something about your document..." disabled />
      <button class="btn" id="askBtn" disabled>Ask</button>
    </div>
  </div>

  <script>
    let collectionName = null;

    const fileInput = document.getElementById('fileInput');
    const fileNameEl = document.getElementById('fileName');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const questionInput = document.getElementById('questionInput');
    const askBtn = document.getElementById('askBtn');
    const chatBox = document.getElementById('chatBox');
    const docLabel = document.getElementById('docLabel');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        fileNameEl.textContent = file.name;
        uploadBtn.disabled = false;
      }
    });

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      setStatus('loading', '⏳ Processing document...');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || 'Upload failed');

        collectionName = data.collection_name;
        setStatus('success', `✅ Ready — ${data.chunks} chunks indexed`);

        docLabel.textContent = `📎 Active document: ${file.name}`;
        docLabel.style.display = 'block';
        questionInput.disabled = false;
        askBtn.disabled = false;
        questionInput.focus();

      } catch (err) {
        setStatus('error', `❌ ${err.message}`);
        uploadBtn.disabled = false;
      }
    });

    askBtn.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendQuestion();
    });

    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question || !collectionName) return;

      appendMessage('user', question);
      questionInput.value = '';
      askBtn.disabled = true;

      const thinking = appendMessage('thinking', '🤔 Thinking...');

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, collection_name: collectionName })
        });
        const data = await res.json();
        thinking.remove();
        appendMessage('assistant', data.answer);
      } catch (err) {
        thinking.remove();
        appendMessage('assistant', '❌ Something went wrong. Please try again.');
      } finally {
        askBtn.disabled = false;
        questionInput.focus();
      }
    }

    function appendMessage(role, text) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.textContent = text;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
      return el;
    }

    function setStatus(type, msg) {
      uploadStatus.className = `status ${type}`;
      uploadStatus.textContent = msg;
    }
  </script>
</body>
</html>
